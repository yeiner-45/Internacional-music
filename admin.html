<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Área de administración - Internacional Music">
    <title>Internacional Music - Admin</title>
    <script>
        // Check authentication and redirect accordingly
        function checkAuthAndRedirect() {
            // This will be handled by auth-status.js when Firebase loads
            // For now, just redirect to login as fallback
            setTimeout(() => {
                if (!window.location.pathname.includes('/login')) {
                    window.location.href = 'login.html';
                }
            }, 100);
        }
    </script>
</head>
<body>
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #0a0a0a; color: #f5f5f5; font-family: Arial, sans-serif;">
        <div style="text-align: center;">
            <h2>Internacional Music</h2>
            <p>Verificando acceso al panel de administración...</p>
            <div style="margin-top: 20px;">
                <div style="width: 40px; height: 40px; border: 4px solid #cc0000; border-top: 4px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
            </div>
        </div>
    </div>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <!-- Load Firebase and auth status -->
    <script type="module">
        import './js/auth-status.js';

        // Fallback redirect after 3 seconds if auth check doesn't work
        setTimeout(() => {
            if (!window.location.pathname.includes('/login') && !window.location.pathname.includes('/dashboard')) {
                window.location.href = 'login.html';
            }
        }, 3000);
    </script>
</body>
